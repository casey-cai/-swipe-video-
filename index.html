<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SWIPE UP</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* Full-viewport stage. dvh keeps it correct while iOS chrome collapses. */
  #stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    height: 100dvh;
    background: #000;
    overflow: hidden;
    opacity: 0;
    transition: opacity 900ms ease;
  }
  #stage.on { opacity: 1; }

  /* Scaled past the viewport so tilt-shift never exposes an edge. */
  #v {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: translate3d(0,0,0) scale(1.28);
    will-change: transform, filter;
    backface-visibility: hidden;
  }

  /* Black curtain: covers the intro, then the ending fade. */
  #curtain {
    position: fixed; inset: 0;
    background: #000;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
  }

  #intro {
    position: fixed; inset: 0;
    z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
    color: #fff;
    background: #000;
    transition: opacity 600ms ease;
  }
  #intro.gone,
  #intro.hidden { opacity: 0; pointer-events: none; }

  .chevrons {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .chevron {
    width: 26px; height: 26px;
    border-left: 1.5px solid #fff;
    border-top: 1.5px solid #fff;
    transform: rotate(45deg);
    opacity: 0;
    animation: rise 2.1s ease-in-out infinite;
  }
  .chevron:nth-child(1) { animation-delay: 0s; }
  .chevron:nth-child(2) { animation-delay: .18s; }
  .chevron:nth-child(3) { animation-delay: .36s; }

  @keyframes rise {
    0%   { opacity: 0;   transform: rotate(45deg) translate(-7px, 7px); }
    35%  { opacity: .95; transform: rotate(45deg) translate(0, 0); }
    70%  { opacity: 0;   transform: rotate(45deg) translate(7px, -7px); }
    100% { opacity: 0;   transform: rotate(45deg) translate(7px, -7px); }
  }

  #label {
    font: 400 13px/1 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: .48em;
    text-indent: .48em;
    opacity: .85;
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: .95; } }

  /* Non-touch devices get a keyboard/click affordance instead of a swipe. */
  #alt {
    position: fixed; bottom: 34px; left: 0; right: 0;
    text-align: center;
    font: 400 10px/1 ui-sans-serif, -apple-system, sans-serif;
    letter-spacing: .22em;
    color: rgba(255,255,255,.3);
    z-index: 30;
    display: none;
  }
  body.no-touch #alt { display: block; }
  body.started #alt { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .chevron, #label { animation: none; opacity: .8; }
  }

  /* Last-resort affordance: a tap produces a click, which WebKit always
     accepts as activation. Only shown if the swipe-borne request failed. */
  #cta {
    position: fixed; left: 50%; bottom: 46px;
    transform: translateX(-50%);
    z-index: 40;
    padding: 13px 22px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 999px;
    font: 400 11px/1 ui-sans-serif, -apple-system, sans-serif;
    letter-spacing: .2em; text-indent: .2em;
    color: #fff; background: rgba(0,0,0,.4);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 400ms ease;
  }
  #cta.show { opacity: 1; pointer-events: auto; }

</style>
</head>
<body>

<div id="stage">
  <video id="v" src="video1.mp4"
         playsinline webkit-playsinline
         preload="auto" disablepictureinpicture></video>
</div>

<div id="curtain"></div>

<div id="intro" class="hidden">
  <div class="chevrons">
    <div class="chevron"></div>
    <div class="chevron"></div>
    <div class="chevron"></div>
  </div>
  <div id="label">SWIPE UP</div>
</div>

<div id="alt">CLICK OR PRESS SPACE</div>

<div id="cta">TAP TO BEGIN</div>

<script>
(() => {
  'use strict';

  // ---- CONFIG ----------------------------------------------------------
  const CFG = {
    TOTAL_PLAYS: 1,      // the clip already contains both passes, so play once
    FADE_LEAD:   1.0,    // s before the final end when the fade starts (0 = only after it ends)
    FADE_MS:     2200,   // fade-to-black duration
    SWIPE_MIN:   60,     // px of upward travel that counts as a swipe
    SWIPE_MAX_T: 900,    // ms, above this it's a drag not a swipe

    TILT_X_RANGE: 40,    // deg of left/right tilt mapped to full horizontal shift
    TILT_Y_RANGE: 32,    // deg of front/back tilt mapped to full vertical shift
    TILT_Z_RANGE: 55,    // deg of flat rotation (alpha) mapped to full depth
    SHIFT_X:      0.11,  // max horizontal shift, as a fraction of viewport width
    SHIFT_Y:      0.11,  // max vertical shift, as a fraction of viewport height

    // Depth. Shift is clamped at render time to whatever room the current
    // scale leaves, so these are free of the pan range. Below 1.0 the video
    // stops filling the screen and floats as a shrinking rectangle on black.
    SCALE_BASE:   1.28,  // neutral, matches the CSS starting transform
    SCALE_NEAR:   2.80,  // rotated one way: pulled closest
    SCALE_FAR:    0.42,  // rotated the other: pushed away into black

    HUE_RANGE:    150,   // deg of hue rotation at full left/right tilt
    SAT_RANGE:    0.45,  // extra saturation at full left/right tilt
    EASE:         0.085  // motion smoothing, lower = heavier
  };
  // ----------------------------------------------------------------------

  const video   = document.getElementById('v');
  const stage   = document.getElementById('stage');
  const curtain = document.getElementById('curtain');
  const intro   = document.getElementById('intro');

  const isTouch = matchMedia('(hover: none) and (pointer: coarse)').matches
                  || 'ontouchstart' in window;
  if (!isTouch) document.body.classList.add('no-touch');

  let started = false;
  let plays = 0;
  let fadeStart = 0;          // performance.now() when the ending fade began

  // Tilt state: targets come from sensor events, current values chase them.
  // Declared up here because the boot dispatch below runs before the tilt
  // section and would otherwise hit these in their temporal dead zone.
  let tiltGranted = false, tiltPending = false, tiltPromise = null;
  let tiltOn = false;
  let baseBeta = null, baseGamma = null, baseAlpha = null;
  let tx = 0, ty = 0, tz = 0, hue = 0;   // targets, normalised -1..1 (hue in deg)
  let cx = 0, cy = 0, cz = 0, chue = 0;  // current, smoothed

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // iOS-style permission model: the sensor is behind requestPermission().
  // Android and desktop expose the events directly.
  const GATED = typeof (window.DeviceOrientationEvent || {}).requestPermission === 'function';

  // --- start ------------------------------------------------------------

  const cta = document.getElementById('cta');
  let playRequested = false;

  function beginPlayback() {
    if (playRequested) return;
    playRequested = true;

    cta.classList.remove('show');
    intro.classList.add('gone');
    stage.classList.add('on');

    const p = video.play();
    if (p && p.catch) {
      p.catch(() => {                 // audio autoplay refused -> go silent
        video.muted = true;
        video.play().catch(() => {});
      });
    }
    requestFullscreenIfPossible();
    keepAwake();
  }

  // Runs fn once any in-flight permission prompt has been answered, so the
  // clip is never burning through its two plays behind a modal dialog.
  function whenTiltSettled(fn) {
    if (tiltPromise) tiltPromise.then(fn, fn);
    else fn();
  }

  // Calling play() inside a gesture and immediately pausing unlocks the
  // element, so a later play() works once the permission dialog is gone.
  function primeVideo() {
    const p = video.play();
    if (p && p.then) {
      p.then(() => { video.pause(); video.currentTime = 0; }).catch(() => {});
    }
  }

  // The sensor prompt has to ride on a real click, which a swipe never
  // produces, so it gets its own screen ahead of the swipe. Once that is
  // settled the swipe screen appears and the swipe goes straight to video.
  function showIntro() {
    cta.classList.remove('show');
    intro.classList.remove('hidden');
  }

  function start() {
    if (started) return;
    started = true;
    document.body.classList.add('started');
    beginPlayback();
  }

  cta.addEventListener('click', () => {
    cta.classList.remove('show');
    primeVideo();                     // unlock media inside this click
    tryEnableTilt();
    whenTiltSettled(showIntro);       // granted or refused, move on
  });

  // Devices without the permission gate skip the tap screen entirely.
  if (GATED) cta.classList.add('show');
  else { tryEnableTilt(); showIntro(); }

  // --- tilt -------------------------------------------------------------

  // WebKit only honours a real click here; touchstart/touchend/pointer events
  // do not carry a usable gesture for this API. The request is therefore
  // attempted from every plausible activation point and the first one that
  // sticks wins, with the tap affordance as the guaranteed fallback.
  function tryEnableTilt() {
    if (tiltGranted || tiltPending) return;

    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return;

    if (!GATED) {
      tiltGranted = true;
      listenTilt();
      return;
    }

    let req;
    try {
      req = DOE.requestPermission();
    } catch (e) {
      return;                                  // no usable gesture; retry later
    }

    tiltPending = true;                        // a prompt is in flight
    tiltPromise = Promise.resolve(req)
      .then(res => {
        tiltPending = false;
        if (res === 'granted') {
          tiltGranted = true;
          listenTilt();
          cta.classList.remove('show');
        }
      })
      .catch(() => { tiltPending = false; });  // gesture was no good, retry later
  }

  function listenTilt() {
    window.addEventListener('deviceorientation', onTilt, { passive: true });
    // Some Android builds only populate the absolute variant.
    window.addEventListener('deviceorientationabsolute', onTilt, { passive: true });
  }

  // Shortest signed distance between two compass angles, so crossing 360/0
  // reads as a small step instead of a full sweep.
  const angleDelta = (a, b) => ((a - b + 540) % 360) - 180;

  function onTilt(e) {
    const { beta, gamma, alpha } = e;

    if (beta == null || gamma == null) return;         // sensor present but idle

    // First good reading becomes the neutral pose, so it works at whatever
    // angle the phone is already being held.
    if (baseBeta === null) { baseBeta = beta; baseGamma = gamma; }
    if (!tiltOn) tiltOn = true;

    const g = clamp((gamma - baseGamma) / CFG.TILT_X_RANGE, -1, 1);  // left/right
    const b = clamp((beta  - baseBeta)  / CFG.TILT_Y_RANGE, -1, 1);  // front/back

    tx  = g;
    ty  = b;
    hue = g * CFG.HUE_RANGE;

    // Depth rides on alpha, the one rotation axis the other two leave free.
    // Some devices report it as null; depth then simply stays neutral.
    if (alpha != null) {
      if (baseAlpha === null) baseAlpha = alpha;
      tz = clamp(angleDelta(alpha, baseAlpha) / CFG.TILT_Z_RANGE, -1, 1);
    }
  }

  // --- render loop ------------------------------------------------------

  let lastT = '', lastF = '', lastO = -1;

  function frame() {
    requestAnimationFrame(frame);

    cx   += (tx  - cx)   * CFG.EASE;
    cy   += (ty  - cy)   * CFG.EASE;
    cz   += (tz  - cz)   * CFG.EASE;
    chue += (hue - chue) * CFG.EASE;

    // Depth is asymmetric around neutral, so each direction gets its own span.
    const scale = CFG.SCALE_BASE + cz *
      (cz >= 0 ? CFG.SCALE_NEAR - CFG.SCALE_BASE : CFG.SCALE_BASE - CFG.SCALE_FAR);

    // How far the video may travel before it either exposes an edge (when it
    // overflows the viewport) or drifts off screen (when it has shrunk inside
    // it). Both cases measure the same distance, so abs() covers the whole
    // range and the pan pinches to nothing exactly where it fills the screen.
    const room = Math.abs(scale - 1) / 2;
    const px = (cx * Math.min(CFG.SHIFT_X, room) * 100).toFixed(2);
    const py = (cy * Math.min(CFG.SHIFT_Y, room) * 100).toFixed(2);

    // Shift is expressed against the video box, which is viewport-sized.
    const t = `translate3d(${px}%, ${py}%, 0) scale(${scale.toFixed(4)})`;
    if (t !== lastT) { video.style.transform = t; lastT = t; }

    if (tiltOn) {
      const sat = (1 + Math.abs(chue) / CFG.HUE_RANGE * CFG.SAT_RANGE).toFixed(3);
      const f = `hue-rotate(${chue.toFixed(1)}deg) saturate(${sat})`;
      if (f !== lastF) { video.style.filter = f; lastF = f; }
    }

    if (fadeStart) {
      const o = clamp((performance.now() - fadeStart) / CFG.FADE_MS, 0, 1);
      if (o !== lastO) { curtain.style.opacity = o; lastO = o; }
      if (o >= 1 && !video.paused) video.pause();
    }
  }
  requestAnimationFrame(frame);

  // --- playback / ending ------------------------------------------------

  function beginFade() {
    if (!fadeStart) fadeStart = performance.now();
  }

  video.addEventListener('ended', () => {
    plays++;
    if (plays < CFG.TOTAL_PLAYS) {
      video.currentTime = 0;
      video.play().catch(() => {});
    } else {
      beginFade();                    // no-op if the lead-in already started it
    }
  });

  video.addEventListener('timeupdate', () => {
    if (CFG.FADE_LEAD <= 0) return;
    if (plays !== CFG.TOTAL_PLAYS - 1) return;         // only on the last pass
    const d = video.duration;
    if (d && isFinite(d) && d - video.currentTime <= CFG.FADE_LEAD) beginFade();
  });

  // --- gesture ----------------------------------------------------------

  let y0 = 0, t0 = 0, rise = 0, tracking = false;

  document.addEventListener('touchstart', e => {
    if (started || !e.touches.length) return;
    y0 = e.touches[0].clientY;
    t0 = performance.now();
    rise = 0;
    tracking = true;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!tracking || started || !e.touches.length) return;
    rise = Math.max(rise, y0 - e.touches[0].clientY);
    // Dim the prompt as the finger travels, so the swipe feels connected.
    const p = clamp(rise / CFG.SWIPE_MIN, 0, 1);
    intro.style.opacity = String(1 - p * 0.7);
  }, { passive: true });

  // Start on touchend, never on touchmove: touchmove does not grant user
  // activation, so iOS would reject both play() and requestPermission().
  document.addEventListener('touchend', () => {
    if (!tracking || started) return;
    tracking = false;
    intro.style.opacity = '';           // restore, whether or not it qualified
    if (rise >= CFG.SWIPE_MIN && performance.now() - t0 <= CFG.SWIPE_MAX_T) start();
  }, { passive: true });

  document.addEventListener('touchcancel', () => {
    tracking = false;
    intro.style.opacity = '';
  }, { passive: true });

  // Desktop preview only.
  if (!isTouch) {
    document.addEventListener('click', start);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
        e.preventDefault();
        start();
      }
    });
    document.addEventListener('wheel', start, { passive: true });
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // --- niceties ---------------------------------------------------------

  function requestFullscreenIfPossible() {
    // iPhone Safari has no element fullscreen; the fixed-inset layout already
    // fills the viewport, so treat this as a bonus on the platforms that do.
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { try { fn.call(el).catch(() => {}); } catch (e) {} }
  }

  async function keepAwake() {
    try { await navigator.wakeLock.request('screen'); } catch (e) {}
  }
})();
</script>
</body>
</html>
